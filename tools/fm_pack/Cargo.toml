[package]
name = "fm_pack"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Developer tool: packs an app version folder and builds the setup exe (plan M8)"

[dependencies]
fm_install = { workspace = true }
fm_memory = { workspace = true }
fm_platform = { workspace = true }
fm_feature_sdk = { workspace = true }
libloading = "0.8"
serde_json = { workspace = true }
sha2 = { workspace = true }
# The review verdict type and its schema for the model (review.rs).
serde = { workspace = true }
schemars = { workspace = true }
# The repo's cargo config in a build: the SDK source check refuses keys that swap a dependency (build.rs).
toml = "1"

[dev-dependencies]
fm_install = { workspace = true, features = ["testing"] }
tempfile = "3"
